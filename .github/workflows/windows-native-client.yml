name: Windows Native Client

on:
  push:
    branches:
      - teamtalk-pro-mic-eq
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  native-client:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Expose workflow run ID
        uses: actions/github-script@v7
        with:
          script: |
            const runId = '${{ github.run_id }}';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: `native-run-id-${runId}`,
              description: 'Native diagnostic workflow run',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`
            });

      - name: Stamp validation version
        shell: pwsh
        run: |
          $appPath = "Client/TeamTalkClassic/AppInfo.h"
          $app = Get-Content $appPath -Raw
          $app = [regex]::Replace($app, '#define APPVERSION_SHORT\s+_T\("[^"]+"\)', '#define APPVERSION_SHORT        _T("5.26.5")')
          Set-Content $appPath $app -Encoding utf8NoBOM

          $sdkPath = "Library/TeamTalk_DLL/TeamTalk.h"
          $sdk = Get-Content $sdkPath -Raw
          $sdk = [regex]::Replace($sdk, '#define TEAMTALK_VERSION\s+"[^"]+"', '#define TEAMTALK_VERSION "5.26.5.5205"')
          Set-Content $sdkPath $sdk -Encoding utf8NoBOM

          $defsPath = "Library/TeamTalkLib/TeamTalkDefs.h"
          $defs = Get-Content $defsPath -Raw
          $defs = [regex]::Replace($defs, '#define TEAMTALK_VERSION\s+"[^"]+"', '#define TEAMTALK_VERSION            "5.26.5.5205"')
          $defs = [regex]::Replace($defs, '#define TEAMTALK_RC_VERSION\s+[^\r\n]+', '#define TEAMTALK_RC_VERSION         5,26,5,5205')
          $defs = [regex]::Replace($defs, '#define TEAMTALK_RC_FILEVERSION\s+"[^"]+"', '#define TEAMTALK_RC_FILEVERSION     "5, 26, 5, 5205"')
          Set-Content $defsPath $defs -Encoding utf8NoBOM

      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          path-type: inherit
          update: true
          install: base-devel
          release: false

      - name: Install NASM
        working-directory: ${{ runner.workspace }}
        shell: cmd
        run: |
          curl -L -o nasm.zip https://www.nasm.us/pub/nasm/releasebuilds/3.01/win64/nasm-3.01-win64.zip
          7z x nasm.zip
          echo %CD%\nasm-3.01>> %GITHUB_PATH%

      - name: Cache TeamTalk toolchain
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.workspace }}/install-toolchain
          key: teamtalk-pro-native-toolchain-win64-${{ hashFiles('Build/**', 'Library/TeamTalkLib/**/CMakeLists.txt', 'CMakeLists.txt') }}
          restore-keys: |
            teamtalk-pro-native-toolchain-win64-
            teamtalk-pro-release-toolchain-win64-
            teamtalk-toolchain-win64-

      - name: Configure native client
        working-directory: ${{ runner.workspace }}
        shell: pwsh
        run: |
          $externalProjects = "ON"
          if ("${{ steps.toolchain-cache.outputs.cache-hit }}" -eq "true") { $externalProjects = "OFF" }
          cmake -S "${{ github.workspace }}" -B output-native-test -A x64 `
            -DBUILD_TEAMTALK_LIBRARIES=OFF `
            -DBUILD_TEAMTALK_SERVERS=OFF `
            -DBUILD_TEAMTALK_DOCUMENTATION=OFF `
            -DBUILD_TEAMTALK_CLIENT_TEAMTALKAPP_DOTNET=OFF `
            -DBUILD_TEAMTALK_CLIENT_PRISM=ON `
            -DFEATURE_WEBRTC=OFF `
            -DTOOLCHAIN_BUILD_EXTERNALPROJECTS=$externalProjects `
            -DTOOLCHAIN_INSTALL_PREFIX=${{ runner.workspace }}/install-toolchain

      - name: Build native client with diagnostics
        working-directory: ${{ runner.workspace }}
        shell: cmd
        run: |
          if not exist "${{ runner.workspace }}\native-build-diagnostics" mkdir "${{ runner.workspace }}\native-build-diagnostics"
          set "BUILD_LOG=${{ runner.workspace }}\native-build-diagnostics\native-build.log"

          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvars64.bat" > "%BUILD_LOG%" 2>&1
          if errorlevel 1 goto :build_failed

          echo ===== BUILD TeamTalk5DLL ===== >> "%BUILD_LOG%"
          cmake --build output-native-test --parallel --config Release --target TeamTalk5DLL --verbose >> "%BUILD_LOG%" 2>&1
          if errorlevel 1 goto :build_failed

          echo ===== BUILD TeamTalk5Classic ===== >> "%BUILD_LOG%"
          cmake --build output-native-test --parallel --config Release --target TeamTalk5Classic --verbose >> "%BUILD_LOG%" 2>&1
          if errorlevel 1 goto :build_failed

          echo ===== BUILD SUCCEEDED ===== >> "%BUILD_LOG%"
          type "%BUILD_LOG%"
          exit /b 0

          :build_failed
          set "BUILD_EXIT=%ERRORLEVEL%"
          echo ===== BUILD FAILED WITH EXIT CODE %BUILD_EXIT% ===== >> "%BUILD_LOG%"
          type "%BUILD_LOG%"
          exit /b %BUILD_EXIT%

      - name: Summarize native build errors
        if: failure()
        shell: pwsh
        run: |
          $log = "${{ runner.workspace }}\native-build-diagnostics\native-build.log"
          if (Test-Path $log) {
            Write-Host "===== LIKELY BUILD ERRORS ====="
            $patterns = 'error C[0-9]+|fatal error|LNK[0-9]+|MSB[0-9]+|CMake Error|FAILED:|ninja: error|error:'
            $matches = Select-String -Path $log -Pattern $patterns -CaseSensitive:$false
            if ($matches) {
              $matches | Select-Object -Last 160 | ForEach-Object { Write-Host $_.Line }
            }
            else {
              Write-Host "No standard compiler error signature found. Last 250 log lines:"
              Get-Content $log -Tail 250
            }
          }
          else {
            Write-Host "No native-build.log exists because the failure happened before the build step."
          }

      - name: Upload native build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-build-diagnostics-${{ github.run_id }}
          path: ${{ runner.workspace }}/native-build-diagnostics
          if-no-files-found: warn
          retention-days: 14

      - name: Verify native client contains no Qt runtime
        working-directory: ${{ runner.workspace }}
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if not exist "${{ github.workspace }}\Client\TeamTalkClassic\TeamTalk5.exe" (
            echo ERROR: TeamTalk5.exe was not produced by the native build.
            exit /b 1
          )
          dumpbin /DEPENDENTS "${{ github.workspace }}\Client\TeamTalkClassic\TeamTalk5.exe" > native-dependencies.txt
          findstr /I "Qt5 Qt6 QtCore QtGui QtWidgets" native-dependencies.txt >nul
          if not errorlevel 1 (
            echo ERROR: Qt dependency found in native TeamTalk5.exe
            type native-dependencies.txt
            exit /b 1
          )
          type native-dependencies.txt
          exit /b 0

      - name: Stage native artifact
        shell: pwsh
        run: |
          $stage = "${{ runner.workspace }}\teamtalk-pro-native-5.26.5"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "${{ github.workspace }}\Client\TeamTalkClassic\TeamTalk5.exe" $stage -Force
          Copy-Item "${{ github.workspace }}\Library\TeamTalk_DLL\TeamTalk5.dll" $stage -Force
          Copy-Item "${{ github.workspace }}\Client\TeamTalkClassic\lng_classic" (Join-Path $stage "lng_classic") -Recurse -Force
          Copy-Item "${{ github.workspace }}\Setup\Client\Sounds" (Join-Path $stage "Sounds") -Recurse -Force

      - name: Upload native validation artifact
        uses: actions/upload-artifact@v7
        with:
          name: teamtalk-pro-native-5.26.5-win64
          path: ${{ runner.workspace }}/teamtalk-pro-native-5.26.5
          if-no-files-found: error
