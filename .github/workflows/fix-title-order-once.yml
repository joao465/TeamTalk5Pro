name: Fix TeamTalk Pro Title Order Once

on:
  push:
    branches: [ "teamtalk-pro-mic-eq" ]
    paths:
      - ".github/workflows/fix-title-order-once.yml"

permissions:
  contents: write

jobs:
  fix-title-order:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: teamtalk-pro-mic-eq

      - name: Put server name first in title
        shell: python
        run: |
          from pathlib import Path
          p = Path("Client/qtTeamTalk/mainwindow.cpp")
          data = p.read_bytes()

          old_crlf = b'''QString MainWindow::getTitle()\r\n{\r\n    QString title = APPTITLE;\r\n    if ((TT_GetFlags(ttInst) & CLIENT_AUTHORIZED) && _Q(m_srvprop.szServerName).size())\r\n    {\r\n        title = QString("TeamTalk 5 (Pro) - %1 (%2)")\r\n                    .arg(limitText(_Q(m_srvprop.szServerName)))\r\n                    .arg(APPVERSION_SHORT);\r\n    }\r\n    return title;\r\n}'''
          new_crlf = b'''QString MainWindow::getTitle()\r\n{\r\n    QString title = APPTITLE;\r\n    if ((TT_GetFlags(ttInst) & CLIENT_AUTHORIZED) && _Q(m_srvprop.szServerName).size())\r\n    {\r\n        title = QString("%1 - TeamTalk 5 (Pro) (%2)")\r\n                    .arg(limitText(_Q(m_srvprop.szServerName)))\r\n                    .arg(APPVERSION_SHORT);\r\n    }\r\n    return title;\r\n}'''

          old_lf = old_crlf.replace(b"\r\n", b"\n")
          new_lf = new_crlf.replace(b"\r\n", b"\n")

          if old_crlf in data:
              data = data.replace(old_crlf, new_crlf, 1)
          elif old_lf in data:
              data = data.replace(old_lf, new_lf, 1)
          else:
              raise SystemExit("Expected getTitle() block was not found")

          p.write_bytes(data)

      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/fix-title-order-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Client/qtTeamTalk/mainwindow.cpp .github/workflows/fix-title-order-once.yml
          git commit -m "Put server name first in TeamTalk Pro title"
          git push origin teamtalk-pro-mic-eq
