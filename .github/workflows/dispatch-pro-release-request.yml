name: Dispatch TeamTalk Pro Release Request

on:
  push:
    branches:
      - master
    paths:
      - "RELEASE_REQUEST.txt"

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v7

      - name: Read requested version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep -Ev '^\s*(#|$)' RELEASE_REQUEST.txt | head -n1 | tr -d '\r' | xargs || true)"
          if [ -z "$version" ]; then
            echo "No release version requested; nothing to dispatch."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Dispatch release and capture run ID
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          before_id="$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow publish-pro-release.yml \
            --branch teamtalk-pro-mic-eq \
            --event workflow_dispatch \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')"

          gh workflow run publish-pro-release.yml \
            --repo "${{ github.repository }}" \
            --ref teamtalk-pro-mic-eq \
            -f version="$VERSION"

          run_id=""
          run_url=""
          run_status=""
          created_at=""

          for _ in $(seq 1 30); do
            latest="$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow publish-pro-release.yml \
              --branch teamtalk-pro-mic-eq \
              --event workflow_dispatch \
              --limit 1 \
              --json databaseId,url,status,createdAt)"

            candidate_id="$(printf '%s' "$latest" | jq -r '.[0].databaseId // empty')"
            if [ -n "$candidate_id" ] && [ "$candidate_id" != "$before_id" ]; then
              run_id="$candidate_id"
              run_url="$(printf '%s' "$latest" | jq -r '.[0].url // empty')"
              run_status="$(printf '%s' "$latest" | jq -r '.[0].status // empty')"
              created_at="$(printf '%s' "$latest" | jq -r '.[0].createdAt // empty')"
              break
            fi
            sleep 2
          done

          if [ -z "$run_id" ]; then
            echo "Release was dispatched, but the new run ID was not discovered in time." >&2
            exit 1
          fi

          jq -n \
            --arg version "$VERSION" \
            --argjson run_id "$run_id" \
            --arg url "$run_url" \
            --arg status "$run_status" \
            --arg created_at "$created_at" \
            '{version:$version,run_id:$run_id,url:$url,status:$status,created_at:$created_at,workflow:"publish-pro-release.yml",branch:"teamtalk-pro-mic-eq"}' \
            > LAST_RELEASE_RUN.json

          content="$(base64 -w0 LAST_RELEASE_RUN.json)"
          current_sha="$(gh api "repos/${{ github.repository }}/contents/LAST_RELEASE_RUN.json?ref=master" --jq '.sha' 2>/dev/null || true)"

          if [ -n "$current_sha" ]; then
            gh api --method PUT "repos/${{ github.repository }}/contents/LAST_RELEASE_RUN.json" \
              -f message="Record TeamTalk Pro $VERSION release run [skip ci]" \
              -f branch="master" \
              -f content="$content" \
              -f sha="$current_sha" >/dev/null
          else
            gh api --method PUT "repos/${{ github.repository }}/contents/LAST_RELEASE_RUN.json" \
              -f message="Record TeamTalk Pro $VERSION release run [skip ci]" \
              -f branch="master" \
              -f content="$content" >/dev/null
          fi

          echo "Release $VERSION run: $run_url"
