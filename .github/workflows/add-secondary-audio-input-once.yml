name: Add Secondary Audio Input Once

on:
  pull_request:
    branches: [ "master" ]
    paths:
      - ".github/workflows/add-secondary-audio-input-once.yml"

permissions:
  contents: write

jobs:
  patch-secondary-audio:
    if: github.head_ref == 'teamtalk-pro-mic-eq'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: teamtalk-pro-mic-eq
          fetch-depth: 0

      - name: Restore original patch source
        shell: bash
        run: |
          git show d3fd1dbce3000a3ec9db8cb4c9184b3c5370defb:.github/workflows/add-secondary-audio-input-once.yml > /tmp/old-secondary.yml
          python - <<'PY'
          import base64, gzip, re, pathlib
          y = pathlib.Path('/tmp/old-secondary.yml').read_text(encoding='utf-8')
          m = re.search(r'PATCH_B64:\s*([A-Za-z0-9+/=]+)', y)
          if not m:
              raise SystemExit('PATCH_B64 not found')
          pathlib.Path('/tmp/secondary_patch.py').write_bytes(gzip.decompress(base64.b64decode(m.group(1))))
          PY

      - name: Make patch tolerant of current source
        shell: python
        run: |
          from pathlib import Path
          p = Path('/tmp/secondary_patch.py')
          s = p.read_text(encoding='utf-8')
          start = s.index('def replace_once')
          end = s.index('\nreplace_once(', start)
          helpers = r'''def _flex_pattern(value):
              import re
              parts = [re.escape(x) for x in re.split(r'\s+', value.strip()) if x]
              return r'\s+'.join(parts)

          def replace_once(path, old, new):
              import re
              p = Path(path)
              data = p.read_text(encoding='utf-8')
              if data.count(old) == 1:
                  p.write_text(data.replace(old, new, 1), encoding='utf-8', newline='\n')
                  return

              matches = list(re.finditer(_flex_pattern(old), data, re.MULTILINE))
              if len(matches) == 1:
                  m = matches[0]
                  p.write_text(data[:m.start()] + new + data[m.end():], encoding='utf-8', newline='\n')
                  return

              old_lines = [line.strip() for line in old.splitlines() if line.strip()]
              lines = data.splitlines(keepends=True)
              candidates = []
              if old_lines:
                  first, last = old_lines[0], old_lines[-1]
                  max_span = len(old_lines) + 12
                  for i, line in enumerate(lines):
                      if line.strip() != first:
                          continue
                      for j in range(i, min(len(lines), i + max_span)):
                          if lines[j].strip() == last:
                              candidates.append((i, j))
                              break
              if len(candidates) == 1:
                  i, j = candidates[0]
                  a = sum(len(x) for x in lines[:i])
                  b = sum(len(x) for x in lines[:j + 1])
                  p.write_text(data[:a] + new + '\n' + data[b:], encoding='utf-8', newline='\n')
                  return

              raise SystemExit(f'{path}: flexible replace failed; exact={data.count(old)}, regex={len(matches)}, spans={len(candidates)}')

          def insert_before(path, marker, text):
              import re
              p = Path(path)
              data = p.read_text(encoding='utf-8')
              if data.count(marker) == 1:
                  p.write_text(data.replace(marker, text + marker, 1), encoding='utf-8', newline='\n')
                  return
              matches = list(re.finditer(_flex_pattern(marker), data, re.MULTILINE))
              if len(matches) != 1:
                  raise SystemExit(f'{path}: flexible insert failed; regex={len(matches)}')
              m = matches[0]
              p.write_text(data[:m.start()] + text + data[m.start():], encoding='utf-8', newline='\n')
          '''
          helpers = '\n'.join(line[10:] if line.startswith('          ') else line for line in helpers.splitlines())
          p.write_text(s[:start] + helpers + s[end:], encoding='utf-8', newline='\n')

      - name: Prepare current source for patch
        shell: python
        run: |
          from pathlib import Path
          p = Path('Library/TeamTalkLib/teamtalk/client/ClientNode.cpp')
          s = p.read_text(encoding='utf-8')
          old = '        CloseVideoCapture();\n        m_mediaplayback_streams.clear(); //clear all players before removing sound group\n        CloseSoundInputDevice();'
          new = '        CloseVideoCapture();\n        CloseSoundInputDevice();\n        m_mediaplayback_streams.clear(); //clear all players before removing sound group'
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8', newline='\n')

      - name: Apply secondary microphone patch
        shell: bash
        run: python /tmp/secondary_patch.py

      - name: Preserve current cleanup ordering
        if: success()
        shell: python
        run: |
          from pathlib import Path
          p = Path('Library/TeamTalkLib/teamtalk/client/ClientNode.cpp')
          s = p.read_text(encoding='utf-8')
          old = '        CloseVideoCapture();\n        CloseSecondarySoundInputDevice();\n        CloseSoundInputDevice();\n        m_mediaplayback_streams.clear(); //clear all players before removing sound group'
          new = '        CloseVideoCapture();\n        CloseSecondarySoundInputDevice();\n        m_mediaplayback_streams.clear(); //clear all players before removing sound group\n        CloseSoundInputDevice();'
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8', newline='\n')

      - name: Verify secondary microphone source
        if: success()
        shell: bash
        run: |
          grep -q 'TT_InitSecondarySoundInputDevice' Library/TeamTalk_DLL/TeamTalk.h
          grep -q 'secondaryInputDevBox' Client/qtTeamTalk/preferences.ui
          grep -q 'MixSecondaryAudio(audframe)' Library/TeamTalkLib/teamtalk/client/ClientNode.cpp
          grep -q 'm_secondary_capture' Library/TeamTalkLib/teamtalk/client/ClientNode.h

      - name: Commit secondary audio input
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-secondary-audio-input-once.yml
          git rm -f .github/secondary_patch_debug.py || true
          git add Client/qtTeamTalk/settings.h Client/qtTeamTalk/utilsound.h Client/qtTeamTalk/utilsound.cpp Client/qtTeamTalk/preferences.ui Client/qtTeamTalk/preferencesdlg.h Client/qtTeamTalk/preferencesdlg.cpp Library/TeamTalk_DLL/TeamTalk.h Library/TeamTalkLib/bin/dll/TeamTalk.cpp Library/TeamTalkLib/teamtalk/client/ClientNode.h Library/TeamTalkLib/teamtalk/client/ClientNode.cpp
          git commit -m "Add secondary microphone input and monitor"
          git push origin teamtalk-pro-mic-eq
