name: Add Secondary Audio Input Once

on:
  pull_request:
    branches: [ "master" ]
    paths:
      - ".github/workflows/add-secondary-audio-input-once.yml"

permissions:
  contents: write

concurrency:
  group: secondary-mic-patch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-secondary-audio:
    if: github.head_ref == 'teamtalk-pro-mic-eq'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: teamtalk-pro-mic-eq
          fetch-depth: 0

      - name: Restore original patch source
        shell: bash
        run: |
          git show d3fd1dbce3000a3ec9db8cb4c9184b3c5370defb:.github/workflows/add-secondary-audio-input-once.yml > /tmp/old-secondary.yml
          python - <<'PY'
          import base64, gzip, re, pathlib
          y = pathlib.Path('/tmp/old-secondary.yml').read_text(encoding='utf-8')
          m = re.search(r'PATCH_B64:\s*([A-Za-z0-9+/=]+)', y)
          if not m:
              raise SystemExit('PATCH_B64 not found')
          pathlib.Path('/tmp/secondary_patch.py').write_bytes(gzip.decompress(base64.b64decode(m.group(1))))
          PY

      - name: Adapt patch to current source safely
        shell: python
        run: |
          from pathlib import Path
          p = Path('/tmp/secondary_patch.py')
          s = p.read_text(encoding='utf-8')
          start = s.index('def replace_once')
          end = s.index('\nreplace_once(', start)
          helpers = r'''def _norm_line(value):
              import re
              return re.sub(r'\s+', '', value)

          def _flex_pattern(value):
              import re
              parts = [re.escape(x) for x in re.split(r'\s+', value.strip()) if x]
              return r'\s+'.join(parts)

          def replace_once(path, old, new):
              import re, difflib
              p = Path(path)
              data = p.read_text(encoding='utf-8').replace('\r\n', '\n')
              old = old.replace('\r\n', '\n')
              new = new.replace('\r\n', '\n')

              if data.count(old) == 1:
                  p.write_text(data.replace(old, new, 1), encoding='utf-8', newline='\n')
                  return

              matches = list(re.finditer(_flex_pattern(old), data, re.MULTILINE))
              if len(matches) == 1:
                  m = matches[0]
                  p.write_text(data[:m.start()] + new + data[m.end():], encoding='utf-8', newline='\n')
                  return

              old_lines = [line.strip() for line in old.splitlines() if line.strip()]
              lines = data.splitlines(keepends=True)
              norm_old = [_norm_line(x) for x in old_lines]
              candidates = []
              if norm_old:
                  first, last = norm_old[0], norm_old[-1]
                  max_span = max(len(norm_old) + 60, 80)
                  for i, line in enumerate(lines):
                      if _norm_line(line.strip()) != first:
                          continue
                      for j in range(i, min(len(lines), i + max_span)):
                          if _norm_line(lines[j].strip()) == last:
                              block = [_norm_line(x.strip()) for x in lines[i:j + 1] if x.strip()]
                              ratio = difflib.SequenceMatcher(None, norm_old, block).ratio()
                              candidates.append((ratio, i, j))
              candidates.sort(reverse=True)
              if candidates and candidates[0][0] >= 0.55 and (len(candidates) == 1 or candidates[0][0] > candidates[1][0] + 0.08):
                  _, i, j = candidates[0]
                  a = sum(len(x) for x in lines[:i])
                  b = sum(len(x) for x in lines[:j + 1])
                  p.write_text(data[:a] + new + '\n' + data[b:], encoding='utf-8', newline='\n')
                  return

              first_preview = old_lines[0] if old_lines else '<empty>'
              last_preview = old_lines[-1] if old_lines else '<empty>'
              raise SystemExit(f'{path}: replace failed; first={first_preview!r}; last={last_preview!r}; regex={len(matches)}; candidates={[(round(x[0],2),x[1],x[2]) for x in candidates[:3]]}')

          def insert_before(path, marker, text):
              import re
              p = Path(path)
              data = p.read_text(encoding='utf-8').replace('\r\n', '\n')
              marker = marker.replace('\r\n', '\n')
              text = text.replace('\r\n', '\n')

              if data.count(marker) == 1:
                  p.write_text(data.replace(marker, text + marker, 1), encoding='utf-8', newline='\n')
                  return

              matches = list(re.finditer(_flex_pattern(marker), data, re.MULTILINE))
              if len(matches) == 1:
                  m = matches[0]
                  p.write_text(data[:m.start()] + text + data[m.start():], encoding='utf-8', newline='\n')
                  return

              marker_lines = [line.strip() for line in marker.splitlines() if line.strip()]
              lines = data.splitlines(keepends=True)
              for wanted in reversed(marker_lines):
                  nwanted = _norm_line(wanted)
                  found = [i for i, line in enumerate(lines) if _norm_line(line.strip()) == nwanted]
                  if len(found) == 1:
                      i = found[0]
                      a = sum(len(x) for x in lines[:i])
                      p.write_text(data[:a] + text + data[a:], encoding='utf-8', newline='\n')
                      return

              raise SystemExit(f'{path}: insert failed; marker-lines={marker_lines!r}; regex={len(matches)}')
          '''
          import textwrap
          helpers = textwrap.dedent(helpers)
          p.write_text(s[:start] + helpers + s[end:], encoding='utf-8', newline='\n')

      - name: Validate adapted patch syntax
        shell: bash
        run: python -m py_compile /tmp/secondary_patch.py

      - name: Prepare current source for patch
        shell: python
        run: |
          from pathlib import Path
          p = Path('Library/TeamTalkLib/teamtalk/client/ClientNode.cpp')
          s = p.read_text(encoding='utf-8').replace('\r\n', '\n')
          old = '        CloseVideoCapture();\n        m_mediaplayback_streams.clear(); //clear all players before removing sound group\n        CloseSoundInputDevice();'
          new = '        CloseVideoCapture();\n        CloseSoundInputDevice();\n        m_mediaplayback_streams.clear(); //clear all players before removing sound group'
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8', newline='\n')

      - name: Apply secondary microphone patch
        shell: bash
        run: python /tmp/secondary_patch.py

      - name: Preserve current cleanup ordering
        shell: python
        run: |
          from pathlib import Path
          p = Path('Library/TeamTalkLib/teamtalk/client/ClientNode.cpp')
          s = p.read_text(encoding='utf-8').replace('\r\n', '\n')
          old = '        CloseVideoCapture();\n        CloseSecondarySoundInputDevice();\n        CloseSoundInputDevice();\n        m_mediaplayback_streams.clear(); //clear all players before removing sound group'
          new = '        CloseVideoCapture();\n        CloseSecondarySoundInputDevice();\n        m_mediaplayback_streams.clear(); //clear all players before removing sound group\n        CloseSoundInputDevice();'
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8', newline='\n')

      - name: Preflight secondary microphone source
        shell: bash
        run: |
          set -e
          grep -q 'TT_InitSecondarySoundInputDevice' Library/TeamTalk_DLL/TeamTalk.h
          grep -q 'TT_CloseSecondarySoundInputDevice' Library/TeamTalk_DLL/TeamTalk.h
          grep -q 'secondaryInputDevBox' Client/qtTeamTalk/preferences.ui
          grep -q 'secondaryMicListenButton' Client/qtTeamTalk/preferences.ui
          grep -q 'MixSecondaryAudio(audframe)' Library/TeamTalkLib/teamtalk/client/ClientNode.cpp
          grep -q 'm_secondary_capture' Library/TeamTalkLib/teamtalk/client/ClientNode.h
          grep -q 'OpenSecondaryAudioCapture' Library/TeamTalkLib/teamtalk/client/ClientNode.cpp
          grep -q 'StreamSecondaryCaptureCb' Library/TeamTalkLib/teamtalk/client/ClientNode.cpp
          if git diff --check 2>&1 | grep -Ev 'trailing whitespace\.|new blank line at EOF\.' | grep -q .; then
            echo 'Non-trivial diff whitespace error detected'
            git diff --check || true
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          ET.parse('Client/qtTeamTalk/preferences.ui')
          checks = {
              'Library/TeamTalk_DLL/TeamTalk.h': ['TT_InitSecondarySoundInputDevice', 'TT_CloseSecondarySoundInputDevice'],
              'Library/TeamTalkLib/teamtalk/client/ClientNode.cpp': ['ClientNode::InitSecondarySoundInputDevice', 'ClientNode::MixSecondaryAudio', 'ClientNode::StreamSecondaryCaptureCb'],
              'Library/TeamTalkLib/teamtalk/client/ClientNode.h': ['InitSecondarySoundInputDevice', 'MixSecondaryAudio', 'm_secondary_capture'],
          }
          for path, symbols in checks.items():
              data = Path(path).read_text(encoding='utf-8')
              for symbol in symbols:
                  if data.count(symbol) < 1:
                      raise SystemExit(f'{path}: missing {symbol}')
          cpp = Path('Library/TeamTalkLib/teamtalk/client/ClientNode.cpp').read_text(encoding='utf-8')
          for definition in ['bool ClientNode::InitSecondarySoundInputDevice(', 'void ClientNode::MixSecondaryAudio(', 'void ClientNode::StreamSecondaryCaptureCb(']:
              count = cpp.count(definition)
              if count != 1:
                  raise SystemExit(f'Unexpected definition count for {definition}: {count}')
          print('secondary microphone preflight passed')
          PY

      - name: Commit secondary audio input
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-secondary-audio-input-once.yml
          git rm -f .github/secondary_patch_debug.py || true
          git add Client/qtTeamTalk/settings.h Client/qtTeamTalk/utilsound.h Client/qtTeamTalk/utilsound.cpp Client/qtTeamTalk/preferences.ui Client/qtTeamTalk/preferencesdlg.h Client/qtTeamTalk/preferencesdlg.cpp Library/TeamTalk_DLL/TeamTalk.h Library/TeamTalkLib/bin/dll/TeamTalk.cpp Library/TeamTalkLib/teamtalk/client/ClientNode.h Library/TeamTalkLib/teamtalk/client/ClientNode.cpp
          git commit -m "Add secondary microphone input and monitor"
          git push origin teamtalk-pro-mic-eq
