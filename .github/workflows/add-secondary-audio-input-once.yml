name: Add Secondary Audio Input Once

on:
  pull_request:
    branches: [ "master" ]
    paths:
      - ".github/workflows/add-secondary-audio-input-once.yml"

permissions:
  contents: write

jobs:
  patch-secondary-audio:
    if: github.head_ref == 'teamtalk-pro-mic-eq'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: teamtalk-pro-mic-eq

      - name: Apply secondary microphone patch
        shell: pwsh
        env:
          PATCH_B64: 
        run: |
          $clientPath = "Library/TeamTalkLib/teamtalk/client/ClientNode.cpp"
          $client = Get-Content $clientPath -Raw
          $eol = if ($client.Contains("`r`n")) { "`r`n" } else { "`n" }
          $currentBlock = "        CloseVideoCapture();${eol}        m_mediaplayback_streams.clear(); //clear all players before removing sound group${eol}        CloseSoundInputDevice();"
          $patchBlock = "        CloseVideoCapture();${eol}        CloseSoundInputDevice();${eol}        m_mediaplayback_streams.clear(); //clear all players before removing sound group"
          if (-not $client.Contains($currentBlock)) { throw "Current ClientNode destructor block not found" }
          $client = $client.Replace($currentBlock, $patchBlock)
          [IO.File]::WriteAllText((Resolve-Path $clientPath), $client, [Text.UTF8Encoding]::new($false))

          python -c "import os,base64,gzip; exec(gzip.decompress(base64.b64decode(os.environ['PATCH_B64'])))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $client = Get-Content $clientPath -Raw
          $eol = if ($client.Contains("`r`n")) { "`r`n" } else { "`n" }
          $patchedBlock = "        CloseVideoCapture();${eol}        CloseSecondarySoundInputDevice();${eol}        CloseSoundInputDevice();${eol}        m_mediaplayback_streams.clear(); //clear all players before removing sound group"
          $finalBlock = "        CloseVideoCapture();${eol}        CloseSecondarySoundInputDevice();${eol}        m_mediaplayback_streams.clear(); //clear all players before removing sound group${eol}        CloseSoundInputDevice();"
          if (-not $client.Contains($patchedBlock)) { throw "Patched ClientNode destructor block not found" }
          $client = $client.Replace($patchedBlock, $finalBlock)
          [IO.File]::WriteAllText((Resolve-Path $clientPath), $client, [Text.UTF8Encoding]::new($false))

      - name: Commit secondary audio input
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-secondary-audio-input-once.yml
          git add Client/qtTeamTalk/settings.h Client/qtTeamTalk/utilsound.h Client/qtTeamTalk/utilsound.cpp Client/qtTeamTalk/preferences.ui Client/qtTeamTalk/preferencesdlg.h Client/qtTeamTalk/preferencesdlg.cpp Library/TeamTalk_DLL/TeamTalk.h Library/TeamTalkLib/bin/dll/TeamTalk.cpp Library/TeamTalkLib/teamtalk/client/ClientNode.h Library/TeamTalkLib/teamtalk/client/ClientNode.cpp
          git commit -m "Add secondary microphone input and monitor"
          git push origin teamtalk-pro-mic-eq
