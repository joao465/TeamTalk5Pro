name: Apply TeamTalk Pro final and build

on:
  push:
    branches: [ "teamtalk-pro-mic-eq" ]
    paths:
      - ".github/workflows/apply-teamtalk-pro-final.yml"
  workflow_dispatch:

concurrency:
  group: teamtalk-pro-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        ref: teamtalk-pro-mic-eq

    - name: Apply final TeamTalk Pro changes
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        function ReadText([string]$Path) {
          return [System.IO.File]::ReadAllText($Path)
        }

        function WriteText([string]$Path, [string]$Text) {
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($Path, $Text, $utf8)
        }

        function ReplaceRequired([string]$Text, [string]$Old, [string]$New, [string]$Description) {
          if (-not $Text.Contains($Old)) {
            throw "Nao encontrei o trecho esperado: $Description"
          }
          return $Text.Replace($Old, $New)
        }

        $appPath = "Client/qtTeamTalk/appinfo.h"
        $app = ReadText $appPath
        $app = $app.Replace('#define APPTITLE            "TeamTalk 5 (pro 5.26.2)"',
                            '#define APPTITLE            "TeamTalk 5 (Pro) (5.26.2)"')
        $app = $app.Replace('#define CLIENTNAME          "TeamTalk 5 (pro 5.26.2)"',
                            '#define CLIENTNAME          "teamtalk 5 (pro) 5.26.2)"')
        if (-not $app.Contains('#define APPTITLE            "TeamTalk 5 (Pro) (5.26.2)"')) {
          throw "Falha ao definir APPTITLE"
        }
        if (-not $app.Contains('#define CLIENTNAME          "teamtalk 5 (pro) 5.26.2)"')) {
          throw "Falha ao definir CLIENTNAME"
        }
        WriteText $appPath $app

        $mainPath = "Client/qtTeamTalk/mainwindow.cpp"
        $main = ReadText $mainPath
        $pattern = 'QString MainWindow::getTitle\(\)\r?\n\{.*?\r?\n\}\r?\n\r?\nvoid MainWindow::updateWindowTitle\(\)'
        $regex = New-Object System.Text.RegularExpressions.Regex(
          $pattern,
          [System.Text.RegularExpressions.RegexOptions]::Singleline
        )
        $matches = $regex.Matches($main)
        if ($matches.Count -ne 1) {
          throw "Esperava encontrar exatamente uma funcao MainWindow::getTitle(); encontrados: $($matches.Count)"
        }
        $nl = if ($main.Contains("`r`n")) { "`r`n" } else { "`n" }
        $replacement = 'QString MainWindow::getTitle()' + $nl +
                       '{' + $nl +
                       '    return QString(APPTITLE);' + $nl +
                       '}' + $nl + $nl +
                       'void MainWindow::updateWindowTitle()'
        $main = $regex.Replace($main, $replacement, 1)
        WriteText $mainPath $main

        $headerPath = "Library/TeamTalk_DLL/TeamTalk.h"
        $header = ReadText $headerPath
        $header = ReplaceRequired $header '#define TEAMTALK_VERSION "5.23.0.5202"' '#define TEAMTALK_VERSION "5.26.2.5202"' 'TEAMTALK_VERSION'
        $header = $header.Replace('     * and transmission. A value of 0 dB leaves a band unchanged.',
                                  '     * and transmission. A value of 0 leaves a band unchanged.')
        $header = $header.Replace('     * @param nBassDB Bass adjustment from -12 to +12 dB.',
                                  '     * @param nBassDB Bass level from 0 (flat/default) to 100 (maximum +12 dB).')
        $header = $header.Replace('     * @param nMidDB Midrange adjustment from -12 to +12 dB.',
                                  '     * @param nMidDB Midrange level from 0 (flat/default) to 100 (maximum +12 dB).')
        $header = $header.Replace('     * @param nTrebleDB Treble adjustment from -12 to +12 dB.',
                                  '     * @param nTrebleDB Treble level from 0 (flat/default) to 100 (maximum +12 dB).')
        WriteText $headerPath $header

        $commands = ReadText "Library/TeamTalkLib/teamtalk/Commands.h"
        if (-not $commands.Contains('#define TEAMTALK_PROTOCOL_VERSION ACE_TEXT("5.14")')) {
          throw "TEAMTALK_PROTOCOL_VERSION mudou; cancelando por seguranca"
        }

        $uiPath = "Client/qtTeamTalk/preferences.ui"
        $ui = ReadText $uiPath
        $startMarker = '<widget class="QGroupBox" name="micEqGroupBox">'
        $endMarker = '<layout class="QHBoxLayout" name="horizontalLayout_10">'
        $start = $ui.IndexOf($startMarker, [System.StringComparison]::Ordinal)
        $end = $ui.IndexOf($endMarker, $start, [System.StringComparison]::Ordinal)
        if ($start -lt 0 -or $end -lt 0 -or $end -le $start) {
          throw "Secao do equalizador nao encontrada"
        }
        $before = $ui.Substring(0, $start)
        $eq = $ui.Substring($start, $end - $start)
        $after = $ui.Substring($end)

        $minCount = ([regex]::Matches($eq, [regex]::Escape('<number>-12</number>'))).Count
        $maxCount = ([regex]::Matches($eq, [regex]::Escape('<number>12</number>'))).Count
        $tickCount = ([regex]::Matches($eq, [regex]::Escape('<number>3</number>'))).Count
        if ($minCount -ne 3 -or $maxCount -ne 3 -or $tickCount -ne 3) {
          throw "Valores antigos do equalizador inesperados: min=$minCount max=$maxCount tick=$tickCount"
        }

        $eq = $eq.Replace('<number>-12</number>', '<number>0</number>')
        $eq = $eq.Replace('<number>12</number>', '<number>100</number>')
        $eq = $eq.Replace('<number>3</number>', '<number>10</number>')
        $eq = $eq.Replace(
          '<string>Ajusta as frequências graves do microfone antes da transmissão</string>',
          '<string>Ajusta as frequências graves do microfone antes da transmissão. 0 é o padrão e 100 é o máximo.</string>')
        $eq = $eq.Replace(
          '<string>Ajusta as frequências médias do microfone antes da transmissão</string>',
          '<string>Ajusta as frequências médias do microfone antes da transmissão. 0 é o padrão e 100 é o máximo.</string>')
        $eq = $eq.Replace(
          '<string>Ajusta as frequências agudas do microfone antes da transmissão</string>',
          '<string>Ajusta as frequências agudas do microfone antes da transmissão. 0 é o padrão e 100 é o máximo.</string>')
        $ui = $before + $eq + $after
        WriteText $uiPath $ui

        $clientPath = "Library/TeamTalkLib/teamtalk/client/ClientNode.cpp"
        $client = ReadText $clientPath
        $client = ReplaceRequired $client 'std::clamp(bass_db, -12, 12)' 'std::clamp(bass_db, 0, 100)' 'clamp graves'
        $client = ReplaceRequired $client 'std::clamp(mid_db, -12, 12)' 'std::clamp(mid_db, 0, 100)' 'clamp medios'
        $client = ReplaceRequired $client 'std::clamp(treble_db, -12, 12)' 'std::clamp(treble_db, 0, 100)' 'clamp agudos'

        $oldBass = '        ConfigureLowShelf(bass, double(samplerate), bass_hz, double(bassdb));'
        $oldMid = '        ConfigurePeak(mid, double(samplerate), mid_hz, 0.8, double(middb));'
        $oldTreble = '        ConfigureHighShelf(treble, double(samplerate), treble_hz, double(trebledb));'
        $nl = if ($client.Contains("`r`n")) { "`r`n" } else { "`n" }

        $newBass = '        // User-facing scale: 0 is flat/default and 100 is maximum.' + $nl +
                   '        // Internally 0..100 maps smoothly to 0..+12 dB.' + $nl +
                   '        double const bass_gain_db = double(bassdb) * 12.0 / 100.0;' + $nl +
                   '        double const mid_gain_db = double(middb) * 12.0 / 100.0;' + $nl +
                   '        double const treble_gain_db = double(trebledb) * 12.0 / 100.0;' + $nl + $nl +
                   '        ConfigureLowShelf(bass, double(samplerate), bass_hz, bass_gain_db);'
        $client = ReplaceRequired $client $oldBass $newBass 'ganho graves'
        $client = ReplaceRequired $client $oldMid '        ConfigurePeak(mid, double(samplerate), mid_hz, 0.8, mid_gain_db);' 'ganho medios'
        $client = ReplaceRequired $client $oldTreble '        ConfigureHighShelf(treble, double(samplerate), treble_hz, treble_gain_db);' 'ganho agudos'
        WriteText $clientPath $client

        $app = ReadText $appPath
        $main = ReadText $mainPath
        $header = ReadText $headerPath
        $client = ReadText $clientPath
        if (-not $app.Contains('#define APPTITLE            "TeamTalk 5 (Pro) (5.26.2)"')) { throw "APPTITLE invalido" }
        if (-not $app.Contains('#define CLIENTNAME          "teamtalk 5 (pro) 5.26.2)"')) { throw "CLIENTNAME invalido" }
        if (-not $main.Contains('    return QString(APPTITLE);')) { throw "Titulo fixo nao aplicado" }
        if (-not $header.Contains('#define TEAMTALK_VERSION "5.26.2.5202"')) { throw "SDK nao esta em 5.26.2.5202" }
        if (-not $client.Contains('std::clamp(bass_db, 0, 100)')) { throw "EQ 0..100 nao aplicado" }
        if (-not $client.Contains('double const bass_gain_db = double(bassdb) * 12.0 / 100.0;')) { throw "Mapeamento EQ nao aplicado" }

        git diff --check -- Client/qtTeamTalk/appinfo.h Client/qtTeamTalk/preferences.ui Library/TeamTalk_DLL/TeamTalk.h Library/TeamTalkLib/teamtalk/client/ClientNode.cpp
        if ($LASTEXITCODE -ne 0) {
          throw "git diff --check encontrou problema nos arquivos sem whitespace legado"
        }

        $mainDiff = git diff -- Client/qtTeamTalk/mainwindow.cpp
        $badAdded = $mainDiff | Where-Object {
          ($_ -match '^\+(?!\+\+)') -and ($_ -match '[ \t]+$')
        }
        if ($badAdded) {
          throw "Whitespace novo indevido em mainwindow.cpp"
        }

    - name: Commit final changes
      shell: pwsh
      run: |
        git config user.name "ChatGPT TeamTalk Build"
        git config user.email "actions@github.com"
        git add -- Client/qtTeamTalk/appinfo.h Client/qtTeamTalk/mainwindow.cpp Client/qtTeamTalk/preferences.ui Library/TeamTalk_DLL/TeamTalk.h Library/TeamTalkLib/teamtalk/client/ClientNode.cpp
        git diff --cached --quiet
        if ($LASTEXITCODE -ne 0) {
          git commit -m "Finalize TeamTalk Pro identity SDK and EQ scale"
          git push origin HEAD:teamtalk-pro-mic-eq
        } else {
          Write-Host "Nenhuma mudanca adicional para commit."
        }

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        arch: win64_msvc2022_64
        version: '6.11.1'
        modules: 'qtmultimedia qtspeech'
        setup-python: false
        cache: true
        cache-key-prefix: teamtalk-fast-qt
        aqtsource: 'aqtinstall@git+https://github.com/miurahr/aqtinstall.git@master'

    - name: Install MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MSYS
        path-type: inherit
        update: true
        install: base-devel
        release: false

    - name: Install NASM
      working-directory: ${{ runner.workspace }}
      shell: cmd
      run: |
        curl -L -o nasm.zip https://www.nasm.us/pub/nasm/releasebuilds/3.01/win64/nasm-3.01-win64.zip
        7z x nasm.zip
        echo %CD%\nasm-3.01>> %GITHUB_PATH%

    - name: Install Inno Setup
      shell: pwsh
      run: |
        choco install innosetup --yes --no-progress

    - name: Cache TeamTalk toolchain
      id: toolchain-cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.workspace }}/install-toolchain
        key: teamtalk-toolchain-win64-${{ hashFiles('Build/**', 'Library/TeamTalkLib/**/CMakeLists.txt', 'CMakeLists.txt') }}
        restore-keys: |
          teamtalk-toolchain-win64-

    - name: Configure client build
      working-directory: ${{ runner.workspace }}
      shell: pwsh
      run: |
        $externalProjects = "ON"
        if ("${{ steps.toolchain-cache.outputs.cache-hit }}" -eq "true") {
          $externalProjects = "OFF"
        }

        cmake -S TeamTalk5 -B output-final -A x64 `
          -DBUILD_TEAMTALK_LIBRARIES=OFF `
          -DBUILD_TEAMTALK_SERVERS=OFF `
          -DBUILD_TEAMTALK_DOCUMENTATION=OFF `
          -DFEATURE_WEBRTC=OFF `
          -DTOOLCHAIN_BUILD_EXTERNALPROJECTS=$externalProjects `
          -DTOOLCHAIN_INSTALL_PREFIX=${{ runner.workspace }}/install-toolchain

    - name: Build TeamTalk client
      working-directory: ${{ runner.workspace }}
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        cmake --build output-final --parallel --config Release --target TeamTalk5
        cmake --build output-final --parallel --config Release --target QtTeamTalk5-windeploy-release

    - name: Create portable and installer source
      shell: pwsh
      run: |
        $stage = "${{ runner.workspace }}\teamtalk-pro-5.26.2-portable-win64"
        $client = Join-Path $stage "Client"
        $installerSource = "${{ runner.workspace }}\teamtalk-pro-5.26.2-installer-source"

        Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item $installerSource -Recurse -Force -ErrorAction SilentlyContinue
        New-Item -ItemType Directory -Force -Path $client | Out-Null

        Copy-Item "${{ github.workspace }}\Client\qtTeamTalk\TeamTalk5.exe" $client -Force

        $dll = Get-ChildItem "${{ github.workspace }}\Library" -Filter "TeamTalk5.dll" -Recurse |
          Where-Object { $_.FullName -notmatch "\\test\\" } |
          Select-Object -First 1
        if (-not $dll) { throw "TeamTalk5.dll nao foi encontrado" }
        Copy-Item $dll.FullName $client -Force

        if (-not (Test-Path "${{ github.workspace }}\Client\qtTeamTalk\windeployqt")) {
          throw "Pasta windeployqt nao foi criada"
        }
        Copy-Item "${{ github.workspace }}\Client\qtTeamTalk\windeployqt\*" $client -Recurse -Force

        $languages = Join-Path $client "languages"
        New-Item -ItemType Directory -Force -Path $languages | Out-Null
        Get-ChildItem "${{ github.workspace }}\Client\qtTeamTalk\languages" -Filter "*.qm" -ErrorAction SilentlyContinue |
          Copy-Item -Destination $languages

        Copy-Item "${{ github.workspace }}\Setup\Client\Windows\TeamTalk5.ini" (Join-Path $client "TeamTalk5Pro.ini") -Force
        Copy-Item "${{ github.workspace }}\Setup\Client\Windows\TeamTalk5.ini" (Join-Path $client "TeamTalk5Pro.ini.default") -Force
        Copy-Item "${{ github.workspace }}\Setup\Client\Sounds" (Join-Path $client "Sounds") -Recurse -Force
        Copy-Item "${{ github.workspace }}\Setup\Installer\Windows\License.txt" (Join-Path $stage "License.txt") -Force

        New-Item -ItemType Directory -Force -Path $installerSource | Out-Null
        Copy-Item (Join-Path $client "*") $installerSource -Recurse -Force
        Remove-Item (Join-Path $installerSource "TeamTalk5Pro.ini") -Force -ErrorAction SilentlyContinue

    - name: Build independent installer
      shell: pwsh
      run: |
        $installerSource = "${{ runner.workspace }}\teamtalk-pro-5.26.2-installer-source"
        $installerOut = "${{ runner.workspace }}\teamtalk-pro-5.26.2-installer-win64"
        $iss = "${{ github.workspace }}\Setup\Installer\Windows\TeamTalkPro.iss"

        Remove-Item $installerOut -Recurse -Force -ErrorAction SilentlyContinue
        New-Item -ItemType Directory -Force -Path $installerOut | Out-Null

        $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
        if (-not (Test-Path $iscc)) {
          $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if ($cmd) { $iscc = $cmd.Source }
        }
        if (-not (Test-Path $iscc)) { throw "ISCC.exe nao encontrado" }

        $defineArg = "-dClientDir=$installerSource"
        & $iscc $defineArg $iss
        if ($LASTEXITCODE -ne 0) { throw "Inno Setup falhou com codigo $LASTEXITCODE" }

        $builtSetup = Join-Path (Split-Path $iss -Parent) "Output\TeamTalk_5_Pro_5.26.2_Setup_x64.exe"
        if (-not (Test-Path $builtSetup)) { throw "Instalador nao encontrado: $builtSetup" }

        $setup = Join-Path $installerOut "TeamTalk_5_Pro_5.26.2_Setup_x64.exe"
        Copy-Item $builtSetup $setup -Force

    - name: Upload portable client
      uses: actions/upload-artifact@v7
      with:
        name: teamtalk-pro-5.26.2-portable-win64-final
        path: ${{ runner.workspace }}/teamtalk-pro-5.26.2-portable-win64
        if-no-files-found: error

    - name: Upload independent installer
      uses: actions/upload-artifact@v7
      with:
        name: teamtalk-pro-5.26.2-installer-win64-final
        path: ${{ runner.workspace }}/teamtalk-pro-5.26.2-installer-win64/TeamTalk_5_Pro_5.26.2_Setup_x64.exe
        if-no-files-found: error
