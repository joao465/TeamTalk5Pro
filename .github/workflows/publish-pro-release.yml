name: Publish TeamTalk Pro Release

# Diagnostic branch runs compile and package the official native build without publishing a GitHub Release.
on:
  push:
    branches:
      - "teamtalk-pro-mic-eq"
    paths:
      - ".github/workflows/publish-pro-release.yml"
    tags:
      - "pro-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versão a publicar, por exemplo 5.26.5"
        required: true
        default: "5.26.5"
        type: string

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Resolve Pro and SDK versions
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($version)) {
            if ("${{ github.ref_type }}" -eq "tag") {
              $version = "${{ github.ref_name }}" -replace '^pro-v', ''
            } else {
              $appPath = "Client/TeamTalkClassic/AppInfo.h"
              $appText = Get-Content $appPath -Raw
              $versionMatch = [regex]::Match($appText, '#define\s+APPVERSION_SHORT\s+_T\("([^"]+)"\)')
              if (-not $versionMatch.Success) {
                throw "Nao foi possivel detectar APPVERSION_SHORT em $appPath"
              }
              $version = $versionMatch.Groups[1].Value
            }
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:\.\d+)?$') {
            throw "Versao invalida: $version"
          }

          $parts = $version.Split('.')
          if ($parts.Count -ge 4) {
            $sdkVersion = $version
          } else {
            $suffix = "{0:D2}" -f [int]$parts[2]
            $sdkVersion = "$version.52$suffix"
          }

          "PRO_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PRO_SDK_VERSION=$sdkVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Building native TeamTalk Pro $version with SDK $sdkVersion"

      - name: Stamp native application and SDK version
        shell: pwsh
        run: |
          $appPath = "Client/TeamTalkClassic/AppInfo.h"
          $appText = Get-Content $appPath -Raw
          $appText = [regex]::Replace($appText, '#define APPVERSION_SHORT\s+_T\("[^"]+"\)', '#define APPVERSION_SHORT        _T("' + $env:PRO_VERSION + '")')
          Set-Content -Path $appPath -Value $appText -Encoding utf8NoBOM

          $sdkHeaderPath = "Library/TeamTalk_DLL/TeamTalk.h"
          $sdkHeaderText = Get-Content $sdkHeaderPath -Raw
          $sdkHeaderText = [regex]::Replace($sdkHeaderText, '#define TEAMTALK_VERSION\s+"[^"]+"', '#define TEAMTALK_VERSION "' + $env:PRO_SDK_VERSION + '"')
          Set-Content -Path $sdkHeaderPath -Value $sdkHeaderText -Encoding utf8NoBOM

          $sdkDefsPath = "Library/TeamTalkLib/TeamTalkDefs.h"
          $sdkDefsText = Get-Content $sdkDefsPath -Raw
          $sdkParts = $env:PRO_SDK_VERSION.Split('.')
          $sdkRcVersion = "$($sdkParts[0]),$($sdkParts[1]),$($sdkParts[2]),$($sdkParts[3])"
          $sdkRcFileVersion = "$($sdkParts[0]), $($sdkParts[1]), $($sdkParts[2]), $($sdkParts[3])"
          $sdkDefsText = [regex]::Replace($sdkDefsText, '#define TEAMTALK_VERSION\s+"[^"]+"', '#define TEAMTALK_VERSION            "' + $env:PRO_SDK_VERSION + '"')
          $sdkDefsText = [regex]::Replace($sdkDefsText, '#define TEAMTALK_RC_VERSION\s+[^\r\n]+', '#define TEAMTALK_RC_VERSION         ' + $sdkRcVersion)
          $sdkDefsText = [regex]::Replace($sdkDefsText, '#define TEAMTALK_RC_FILEVERSION\s+"[^"]+"', '#define TEAMTALK_RC_FILEVERSION     "' + $sdkRcFileVersion + '"')
          Set-Content -Path $sdkDefsPath -Value $sdkDefsText -Encoding utf8NoBOM

          Select-String -Path $appPath -Pattern 'APPVERSION_SHORT'
          Select-String -Path $sdkHeaderPath -Pattern 'TEAMTALK_VERSION'
          Select-String -Path $sdkDefsPath -Pattern 'TEAMTALK_VERSION|TEAMTALK_RC_VERSION|TEAMTALK_RC_FILEVERSION'

      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          path-type: inherit
          update: true
          install: base-devel
          release: false

      - name: Install NASM
        working-directory: ${{ runner.workspace }}
        shell: cmd
        run: |
          curl -L -o nasm.zip https://www.nasm.us/pub/nasm/releasebuilds/3.01/win64/nasm-3.01-win64.zip
          7z x nasm.zip
          echo %CD%\nasm-3.01>> %GITHUB_PATH%

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Cache TeamTalk toolchain
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.workspace }}/install-toolchain
          key: teamtalk-pro-native-toolchain-win64-${{ hashFiles('Build/**', 'Library/TeamTalkLib/**/CMakeLists.txt', 'CMakeLists.txt') }}
          restore-keys: |
            teamtalk-pro-native-toolchain-win64-
            teamtalk-pro-release-toolchain-win64-
            teamtalk-toolchain-win64-

      - name: Configure native release build with diagnostics
        working-directory: ${{ runner.workspace }}
        shell: pwsh
        run: |
          $diagDir = Join-Path $env:GITHUB_WORKSPACE "official-diagnostics"
          $logFile = Join-Path $diagDir "native-build.log"
          $summaryFile = Join-Path $diagDir "native-error-summary.txt"
          New-Item -ItemType Directory -Path $diagDir -Force | Out-Null
          "===== Configure native TeamTalk Pro $env:PRO_VERSION =====" | Set-Content -Path $logFile -Encoding utf8

          $externalProjects = "ON"
          if ("${{ steps.toolchain-cache.outputs.cache-hit }}" -eq "true") {
            $externalProjects = "OFF"
          }

          cmake -S "${{ github.workspace }}" -B output-pro-native-release -A x64 `
            -DBUILD_TEAMTALK_LIBRARIES=OFF `
            -DBUILD_TEAMTALK_SERVERS=OFF `
            -DBUILD_TEAMTALK_DOCUMENTATION=OFF `
            -DBUILD_TEAMTALK_CLIENT_TEAMTALKAPP_DOTNET=OFF `
            -DBUILD_TEAMTALK_CLIENT_PRISM=ON `
            -DFEATURE_WEBRTC=OFF `
            -DTOOLCHAIN_BUILD_EXTERNALPROJECTS=$externalProjects `
            -DTOOLCHAIN_INSTALL_PREFIX=${{ runner.workspace }}/install-toolchain `
            2>&1 | Tee-Object -FilePath $logFile -Append
          $configureExitCode = $LASTEXITCODE

          if ($configureExitCode -ne 0) {
            $errorLines = Get-Content $logFile | Where-Object { $_ -match 'error|fatal|LNK[0-9]{4}|C[0-9]{4}|MSB[0-9]{4}|ninja: build stopped' }
            if ($errorLines) {
              $errorLines | Set-Content -Path $summaryFile -Encoding utf8
            } else {
              Get-Content $logFile -Tail 250 | Set-Content -Path $summaryFile -Encoding utf8
            }
            Write-Host "::group::Native configure failure - last 250 log lines"
            Get-Content $logFile -Tail 250
            Write-Host "::endgroup::"
            exit $configureExitCode
          }

      - name: Build native TeamTalk Pro client and SDK DLL with diagnostics
        working-directory: ${{ runner.workspace }}
        shell: pwsh
        run: |
          $diagDir = Join-Path $env:GITHUB_WORKSPACE "official-diagnostics"
          $logFile = Join-Path $diagDir "native-build.log"
          $summaryFile = Join-Path $diagDir "native-error-summary.txt"
          New-Item -ItemType Directory -Path $diagDir -Force | Out-Null

          $vcvars = "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) {
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            if (Test-Path $vswhere) {
              $vsInstall = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1)
              if ($vsInstall) {
                $vcvars = Join-Path $vsInstall "VC\Auxiliary\Build\vcvars64.bat"
              }
            }
          }
          if (-not (Test-Path $vcvars)) {
            "fatal: vcvars64.bat was not found" | Tee-Object -FilePath $logFile -Append
            "fatal: vcvars64.bat was not found" | Set-Content -Path $summaryFile -Encoding utf8
            exit 1
          }

          function Write-FailureSummary {
            param([int]$ExitCode, [string]$Stage)
            $errorLines = Get-Content $logFile | Where-Object { $_ -match 'error|fatal|LNK[0-9]{4}|C[0-9]{4}|MSB[0-9]{4}|ninja: build stopped' }
            if ($errorLines) {
              @("Stage: $Stage", "Exit code: $ExitCode", "") + $errorLines | Set-Content -Path $summaryFile -Encoding utf8
            } else {
              @("Stage: $Stage", "Exit code: $ExitCode", "") + (Get-Content $logFile -Tail 250) | Set-Content -Path $summaryFile -Encoding utf8
            }
            Write-Host "::group::$Stage failure - last 250 log lines"
            Get-Content $logFile -Tail 250
            Write-Host "::endgroup::"
          }

          "===== Build TeamTalk5DLL --verbose =====" | Tee-Object -FilePath $logFile -Append
          $dllCommand = "call `"$vcvars`" && cmake --build output-pro-native-release --parallel --config Release --target TeamTalk5DLL --verbose"
          & cmd.exe /d /s /c $dllCommand 2>&1 | Tee-Object -FilePath $logFile -Append
          $dllExitCode = $LASTEXITCODE
          if ($dllExitCode -ne 0) {
            Write-FailureSummary -ExitCode $dllExitCode -Stage "TeamTalk5DLL"
            exit $dllExitCode
          }

          "===== Build TeamTalk5Classic --verbose =====" | Tee-Object -FilePath $logFile -Append
          $clientCommand = "call `"$vcvars`" && cmake --build output-pro-native-release --parallel --config Release --target TeamTalk5Classic --verbose"
          & cmd.exe /d /s /c $clientCommand 2>&1 | Tee-Object -FilePath $logFile -Append
          $clientExitCode = $LASTEXITCODE
          if ($clientExitCode -ne 0) {
            Write-FailureSummary -ExitCode $clientExitCode -Stage "TeamTalk5Classic"
            exit $clientExitCode
          }

          @(
            "TeamTalk Pro official native build succeeded.",
            "Version: $env:PRO_VERSION",
            "SDK: $env:PRO_SDK_VERSION",
            "Commit: $env:GITHUB_SHA"
          ) | Set-Content -Path (Join-Path $diagDir "build-success.txt") -Encoding utf8

      - name: Verify release contains no Qt runtime
        shell: pwsh
        run: |
          $exe = "${{ github.workspace }}\Client\TeamTalkClassic\TeamTalk5.exe"
          $dll = "${{ github.workspace }}\Library\TeamTalk_DLL\TeamTalk5.dll"
          if (-not (Test-Path $exe)) { throw "Native TeamTalk5.exe nao foi encontrado" }
          if (-not (Test-Path $dll)) { throw "TeamTalk5.dll nao foi encontrada" }
          Write-Host "Native executable: $exe"
          Write-Host "SDK DLL: $dll"

      - name: Create portable installer source and SDK
        shell: pwsh
        run: |
          $stage = "${{ runner.workspace }}\teamtalk-pro-$env:PRO_VERSION-portable-win64"
          $client = Join-Path $stage "Client"
          $installerSource = "${{ runner.workspace }}\teamtalk-pro-$env:PRO_VERSION-installer-source"
          $sdkStage = "${{ runner.workspace }}\teamtalk-pro-$env:PRO_VERSION-sdk-win64"
          $assets = "${{ github.workspace }}\release-assets"

          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $installerSource -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $sdkStage -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $assets -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $client,$installerSource,$sdkStage,$assets | Out-Null

          Copy-Item "${{ github.workspace }}\Client\TeamTalkClassic\TeamTalk5.exe" $client -Force
          Copy-Item "${{ github.workspace }}\Library\TeamTalk_DLL\TeamTalk5.dll" $client -Force
          Copy-Item "${{ github.workspace }}\Client\TeamTalkClassic\lng_classic" (Join-Path $client "lng_classic") -Recurse -Force
          Copy-Item "${{ github.workspace }}\Setup\Client\Sounds" (Join-Path $client "Sounds") -Recurse -Force
          Copy-Item "${{ github.workspace }}\Setup\Installer\Windows\License.txt" (Join-Path $stage "License.txt") -Force

          Copy-Item (Join-Path $client "*") $installerSource -Recurse -Force

          $sdkInclude = Join-Path $sdkStage "include"
          $sdkBin = Join-Path $sdkStage "bin"
          $sdkLib = Join-Path $sdkStage "lib"
          New-Item -ItemType Directory -Force -Path $sdkInclude,$sdkBin,$sdkLib | Out-Null
          Get-ChildItem "${{ github.workspace }}\Library\TeamTalk_DLL" -Filter "*.h" | Copy-Item -Destination $sdkInclude
          Copy-Item "${{ github.workspace }}\Library\TeamTalkLib\TeamTalkDefs.h" $sdkInclude -Force
          Copy-Item "${{ github.workspace }}\Library\TeamTalk_DLL\TeamTalk5.dll" $sdkBin -Force
          $importLib = Get-ChildItem "${{ github.workspace }}" -Filter "TeamTalk5.lib" -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch "\\test\\" } | Select-Object -First 1
          if ($importLib) { Copy-Item $importLib.FullName $sdkLib -Force }
          @(
            "TeamTalk 5 Pro SDK $env:PRO_SDK_VERSION",
            "Client release: $env:PRO_VERSION",
            "Windows x64",
            "Includes TeamTalk Pro microphone equalizer and secondary sound input APIs."
          ) | Set-Content (Join-Path $sdkStage "README.txt") -Encoding utf8

          Compress-Archive -Path (Join-Path $stage "*") `
            -DestinationPath (Join-Path $assets "teamtalk-pro-$env:PRO_VERSION-portable-win64.zip") `
            -CompressionLevel Optimal -Force
          Compress-Archive -Path (Join-Path $sdkStage "*") `
            -DestinationPath (Join-Path $assets "teamtalk-pro-$env:PRO_VERSION-sdk-win64.zip") `
            -CompressionLevel Optimal -Force

      - name: Build versioned native installer
        shell: pwsh
        run: |
          $installerSource = "${{ runner.workspace }}\teamtalk-pro-$env:PRO_VERSION-installer-source"
          $iss = "${{ github.workspace }}\Setup\Installer\Windows\TeamTalkPro.iss"
          $assets = "${{ github.workspace }}\release-assets"

          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe nao foi encontrado" }

          & $iscc "-dClientDir=$installerSource" "-dProVersion=$env:PRO_VERSION" $iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup falhou com codigo $LASTEXITCODE" }

          $setupName = "TeamTalk_5_Pro_$env:PRO_VERSION`_Setup_x64.exe"
          $builtSetup = Join-Path (Split-Path $iss -Parent) "Output\$setupName"
          if (-not (Test-Path $builtSetup)) { throw "Instalador nao encontrado: $builtSetup" }
          Copy-Item $builtSetup (Join-Path $assets $setupName) -Force

      - name: Upload official build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: teamtalk-pro-${{ env.PRO_VERSION }}-official-build-diagnostics
          path: official-diagnostics/*
          if-no-files-found: warn
          retention-days: 14

      - name: Upload release build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: teamtalk-pro-${{ env.PRO_VERSION }}-native-release-assets
          path: release-assets/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/pro-v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pro-v${{ env.PRO_VERSION }}
          name: TeamTalk 5 Pro ${{ env.PRO_VERSION }} Native
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          body: |
            TeamTalk 5 Pro ${{ env.PRO_VERSION }} para Windows x64.
            SDK TeamTalk Pro: ${{ env.PRO_SDK_VERSION }}.

            Esta versão migra o cliente Windows para uma interface nativa MFC/Win32 e não distribui Qt.
            O instalador mantém o mesmo AppId e é detectado automaticamente pelas versões Qt anteriores do TeamTalk 5 Pro.
            As configurações existentes são migradas na primeira inicialização.

            Inclui o SDK atualizado com as APIs Pro de equalizador do microfone e entrada de áudio secundária.
          files: |
            release-assets/TeamTalk_5_Pro_${{ env.PRO_VERSION }}_Setup_x64.exe
            release-assets/teamtalk-pro-${{ env.PRO_VERSION }}-portable-win64.zip
            release-assets/teamtalk-pro-${{ env.PRO_VERSION }}-sdk-win64.zip
          fail_on_unmatched_files: true
